name: Docker Publish from Develop

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Run Tests'
        required: false
        default: true
        type: boolean
      version:
        description: 'Release Version'
        required: true
        type: string

jobs:
  # Job 1: Build frontend and .NET application
  build-app:
    name: Build Application
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    env:
      BUILD_CONFIG: 'Release'
    steps:
    - uses: actions/checkout@v3
      with:
        ref: 'develop'

    # Checkout and build frontend from leadcms.admin (develop branch)
    - name: Checkout frontend (leadcms.admin)
      uses: actions/checkout@v3
      with:
        repository: LeadCMS/leadcms.admin
        ref: develop
        path: leadcms.admin

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.19.0'
        cache: 'npm'
        cache-dependency-path: leadcms.admin/package-lock.json

    - name: Set frontend environment variables
      run: |
        echo "TINYMCE_API_KEY=${{ secrets.TINYMCE_API_KEY }}" > ./leadcms.admin/.env
        echo "VERSION=${{ github.event.inputs.version }}" >> ./leadcms.admin/.env

    - name: Install frontend dependencies
      working-directory: ./leadcms.admin
      run: npm ci

    - name: Build frontend
      working-directory: ./leadcms.admin
      run: npm run build

    - name: Copy frontend build to backend wwwroot
      run: |
        mkdir -p ./src/LeadCMS/wwwroot
        rm -rf ./src/LeadCMS/wwwroot/*
        cp -r ./leadcms.admin/dist/* ./src/LeadCMS/wwwroot/

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x

    - name: Setup NuGet
      uses: nuget/setup-nuget@v1
      with:
        nuget-version: 'latest'

    - name: Docker Compose Setup
      if: ${{ github.event.inputs.run_tests == 'true' }}
      run: docker compose -f ./docker-compose/docker-compose.tests.yml up -d

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration $BUILD_CONFIG -p:Version=${{ github.event.inputs.version }} --no-restore

    - name: Test
      if: ${{ github.event.inputs.run_tests == 'true' }}
      run: dotnet test --no-build --configuration $BUILD_CONFIG --logger "trx" --verbosity d --results-directory "./"

    - name: Upload test results
      if: ${{ github.event.inputs.run_tests == 'true' }} && (success() || failure())
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: ./*.trx

    # Upload build artifacts for Docker build jobs
    - name: Upload build context
      uses: actions/upload-artifact@v4
      with:
        name: build-context
        path: |
          ./
          !./leadcms.admin
          !./TestResults
        retention-days: 1

  # Job 2: Build Docker images in parallel for each platform
  build-docker:
    name: Build Docker (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: build-app
    strategy:
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
    - name: Download build context
      uses: actions/download-artifact@v4
      with:
        name: build-context
        path: ./

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_API_USERNAME }}
        password: ${{ secrets.DOCKER_API_KEY }}

    - name: Extract platform suffix
      id: platform
      run: |
        PLATFORM_PAIR=${{ matrix.platform }}
        PLATFORM_SUFFIX=${PLATFORM_PAIR//\//-}
        echo "suffix=${PLATFORM_SUFFIX}" >> $GITHUB_OUTPUT

    - name: Build and push by digest
      id: build
      uses: docker/build-push-action@v6
      with:
        context: ./
        file: src/LeadCMS/Dockerfile
        platforms: ${{ matrix.platform }}
        outputs: type=image,name=leadcms/core,push-by-digest=true,name-canonical=true,push=true
        cache-from: type=registry,ref=leadcms/core:buildcache-${{ steps.platform.outputs.suffix }}
        cache-to: type=registry,ref=leadcms/core:buildcache-${{ steps.platform.outputs.suffix }},mode=max

    - name: Export digest
      run: |
        mkdir -p /tmp/digests
        digest="${{ steps.build.outputs.digest }}"
        touch "/tmp/digests/${digest#sha256:}"

    - name: Upload digest
      uses: actions/upload-artifact@v4
      with:
        name: digests-${{ steps.platform.outputs.suffix }}
        path: /tmp/digests/*
        if-no-files-found: error
        retention-days: 1

  # Job 3: Merge manifests and create multi-platform image
  merge-docker:
    name: Create Multi-Platform Image
    runs-on: ubuntu-latest
    needs: build-docker
    steps:
    - name: Download digests
      uses: actions/download-artifact@v4
      with:
        path: /tmp/digests
        pattern: digests-*
        merge-multiple: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_API_USERNAME }}
        password: ${{ secrets.DOCKER_API_KEY }}

    - name: Create manifest list and push
      working-directory: /tmp/digests
      run: |
        docker buildx imagetools create \
          --tag leadcms/core:develop \
          --tag leadcms/core:${{ github.event.inputs.version }} \
          $(printf 'leadcms/core@sha256:%s ' *)

    - name: Inspect image
      run: |
        docker buildx imagetools inspect leadcms/core:develop
        docker buildx imagetools inspect leadcms/core:${{ github.event.inputs.version }}

  # Job 4: Publish to NuGet (runs after successful Docker build)
  publish-nuget:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: merge-docker
    steps:
    - name: Download build context
      uses: actions/download-artifact@v4
      with:
        name: build-context
        path: ./

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x

    - name: Publish to NuGet
      run: dotnet nuget push **/*.nupkg --source 'https://api.nuget.org/v3/index.json' --api-key ${{secrets.NUGET_API_KEY}} --skip-duplicate