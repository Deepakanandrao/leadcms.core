name: Manual - Build, Test & Publish
run-name: "Manual - Build, Test & Publish #${{ github.run_number }} (develop)"

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run Tests"
        required: false
        default: true
        type: boolean

jobs:
  # Compute the version for this build
  compute-version:
    name: Compute Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "develop"
      - name: Read base version from source
        id: read-version
        run: |
          BASE=$(grep -oP '(?<=<ReleaseVersion>)[^<]+' src/LeadCMS/LeadCMS.csproj | cut -d. -f1,2)
          echo "base_version=$BASE" >> $GITHUB_OUTPUT
      - name: Set version
        id: set-version
        run: echo "version=${{ steps.read-version.outputs.base_version }}.${{ github.run_number }}-pre" >> $GITHUB_OUTPUT

  # Job 1a: Build frontend (runs in parallel with backend)
  build-frontend:
    name: Build Frontend
    needs: compute-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frontend (leadcms.admin)
        uses: actions/checkout@v4
        with:
          repository: LeadCMS/leadcms.admin
          ref: develop

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Update package.json version
        run: npm version ${{ needs.compute-version.outputs.version }} --no-git-tag-version

      - name: Set frontend environment variables
        run: |
          echo "TINYMCE_API_KEY=${{ secrets.TINYMCE_API_KEY }}" > ./.env
          echo "VERSION=${{ needs.compute-version.outputs.version }}" >> ./.env

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1

  # Job 1b: Build backend (runs in parallel with frontend)
  build-backend:
    name: Build Backend
    needs: compute-version
    runs-on: ubuntu-latest
    env:
      BUILD_CONFIG: "Release"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "develop"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration $BUILD_CONFIG -p:Version=${{
          needs.compute-version.outputs.version }} --no-restore

      - name: Pack plugins for NuGet
        run: |
          while IFS= read -r project; do
            dotnet pack "$project" \
              --configuration $BUILD_CONFIG \
              --no-build \
              -p:Version=${{ needs.compute-version.outputs.version }} \
              -p:PackageVersion=${{ needs.compute-version.outputs.version }} \
              -p:IsPackable=true
          done < <(find ./plugins -name "*.csproj" -not -path "*/obj/*")

      - name: Upload test binaries
        uses: actions/upload-artifact@v4
        with:
          name: test-binary
          path: tests/LeadCMS.Tests/bin/Release/
          retention-days: 1

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: "**/*.nupkg"
          retention-days: 1

  # Job 1c: Run matrix tests (skipped when run_tests is false)
  test-backend:
    name: Matrix Tests
    needs: build-backend
    if: ${{ github.event.inputs.run_tests == 'true' }}
    permissions:
      checks: write
      contents: read
    uses: ./.github/workflows/reusable-matrix-tests.yml
    with:
      build-artifact-name: test-binary

  # Job 2: Build Docker images in parallel for each platform
  build-docker:
    name: Build Docker (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: [compute-version, build-frontend, build-backend, test-backend]
    if: |
      always() &&
      needs.compute-version.result == 'success' &&
      needs.build-frontend.result == 'success' &&
      needs.build-backend.result == 'success' &&
      (needs.test-backend.result == 'success' || needs.test-backend.result == 'skipped')
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: "develop"

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./src/LeadCMS/wwwroot

      - name: Set up QEMU (only for cross-platform builds)
        if: matrix.platform != runner.arch
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_API_USERNAME }}
          password: ${{ secrets.DOCKER_API_KEY }}

      - name: Extract platform suffix
        id: platform
        run: |
          PLATFORM_PAIR=${{ matrix.platform }}
          PLATFORM_SUFFIX=${PLATFORM_PAIR//\//-}
          echo "suffix=${PLATFORM_SUFFIX}" >> $GITHUB_OUTPUT

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: src/LeadCMS/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=leadcms/core,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=leadcms/core:buildcache-${{
            steps.platform.outputs.suffix }}
          cache-to: type=registry,ref=leadcms/core:buildcache-${{
            steps.platform.outputs.suffix }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.platform.outputs.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Job 3: Merge manifests and create multi-platform image
  merge-docker:
    name: Create Multi-Platform Image
    runs-on: ubuntu-latest
    needs: [compute-version, build-docker]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_API_USERNAME }}
          password: ${{ secrets.DOCKER_API_KEY }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            --tag leadcms/core:develop \
            --tag leadcms/core:${{ needs.compute-version.outputs.version }} \
            $(printf 'leadcms/core@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect leadcms/core:develop
          docker buildx imagetools inspect leadcms/core:${{ needs.compute-version.outputs.version }}

  # Job 4: Publish to NuGet (can run in parallel with Docker merge)
  publish-nuget:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: [build-backend, test-backend]
    if: |
      always() &&
      needs.build-backend.result == 'success' &&
      (needs.test-backend.result == 'success' || needs.test-backend.result == 'skipped')
    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./packages

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish to NuGet
        run: dotnet nuget push ./packages/**/*.nupkg --source
          'https://api.nuget.org/v3/index.json' --api-key
          ${{secrets.NUGET_API_KEY}} --skip-duplicate

  # Job 5: Tag the release commit
  tag-release:
    name: Tag Release
    runs-on: ubuntu-latest
    needs: [compute-version, merge-docker, publish-nuget]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "develop"
      - name: Create and push version tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag v${{ needs.compute-version.outputs.version }}
          git push origin v${{ needs.compute-version.outputs.version }}
