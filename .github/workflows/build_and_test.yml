name: PR & Develop - Build & Test

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  BUILD_CONFIG: Release
  DOTNET_VERSION: 8.0.x

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration ${{ env.BUILD_CONFIG }} -p:Version=1.0.0
          --no-restore

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-output
          path: tests/LeadCMS.Tests/bin/${{ env.BUILD_CONFIG }}/
          retention-days: 1

  test:
    name: Test / ${{ matrix.group }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Groups match on the CLASS NAME only, not method names.
          # The pattern "FullyQualifiedName~.Tests.Keyword" anchors on the
          # LeadCMS.Tests.<ClassName> boundary, so a method like
          # ContactTests.SendEmailTest() does NOT bleed into email-campaigns.
          # Add a keyword only when introducing a new domain test class prefix.
          # The 'core' group is a catch-all and never needs to be updated.
          - group: email-campaigns
            # class prefixes: Email, Imap, Campaign, Sequence, Deploy
            filter: "FullyQualifiedName~.Tests.Email|FullyQualifiedName~.Tests.Imap|FullyQu\
              alifiedName~.Tests.Campaign|FullyQualifiedName~.Tests.Sequence|Fu\
              llyQualifiedName~.Tests.Deploy"
          - group: contacts-crm
            # class prefixes: Contact, Deal, Segment, Language, Phone
            filter: "FullyQualifiedName~.Tests.Contact|FullyQualifiedName~.Tests.Deal|Fully\
              QualifiedName~.Tests.Segment|FullyQualifiedName~.Tests.Language|F\
              ullyQualifiedName~.Tests.Phone"
          - group: content-media
            # class prefixes: Content, Media, File, Mdx, Static, Translation, AI, Link
            filter: "FullyQualifiedName~.Tests.Content|FullyQualifiedName~.Tests.Media|Full\
              yQualifiedName~.Tests.File|FullyQualifiedName~.Tests.Mdx|FullyQua\
              lifiedName~.Tests.Static|FullyQualifiedName~.Tests.Translation|Fu\
              llyQualifiedName~.Tests.AI|FullyQualifiedName~.Tests.Link"
          - group: settings-auth
            # class prefixes: Setting, Config, Auth, Identity, User, Account, Password, Plugin, ChangeLog
            filter: "FullyQualifiedName~.Tests.Setting|FullyQualifiedName~.Tests.Config|Ful\
              lyQualifiedName~.Tests.Auth|FullyQualifiedName~.Tests.Identity|Fu\
              llyQualifiedName~.Tests.User|FullyQualifiedName~.Tests.Account|Fu\
              llyQualifiedName~.Tests.Password|FullyQualifiedName~.Tests.Plugin\
              |FullyQualifiedName~.Tests.ChangeLog"
          - group: core
            # Catch-all: negation of every class prefix above.
            # Self-maintaining — no update needed when adding new test classes.
            # Only update when a new keyword is added to one of the named groups above.
            filter: "!FullyQualifiedName~.Tests.Email&!FullyQualifiedName~.Tests.Imap&!Full\
              yQualifiedName~.Tests.Campaign&!FullyQualifiedName~.Tests.Sequenc\
              e&!FullyQualifiedName~.Tests.Deploy&!FullyQualifiedName~.Tests.Co\
              ntact&!FullyQualifiedName~.Tests.Deal&!FullyQualifiedName~.Tests.\
              Segment&!FullyQualifiedName~.Tests.Language&!FullyQualifiedName~.\
              Tests.Phone&!FullyQualifiedName~.Tests.Content&!FullyQualifiedNam\
              e~.Tests.Media&!FullyQualifiedName~.Tests.File&!FullyQualifiedNam\
              e~.Tests.Mdx&!FullyQualifiedName~.Tests.Static&!FullyQualifiedNam\
              e~.Tests.Translation&!FullyQualifiedName~.Tests.AI&!FullyQualifie\
              dName~.Tests.Link&!FullyQualifiedName~.Tests.Setting&!FullyQualif\
              iedName~.Tests.Config&!FullyQualifiedName~.Tests.Auth&!FullyQuali\
              fiedName~.Tests.Identity&!FullyQualifiedName~.Tests.User&!FullyQu\
              alifiedName~.Tests.Account&!FullyQualifiedName~.Tests.Password&!F\
              ullyQualifiedName~.Tests.Plugin&!FullyQualifiedName~.Tests.Change\
              Log"
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set vm.max_map_count for Elasticsearch
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Start Docker services
        run: docker compose -f ./docker-compose/docker-compose.tests.yml up -d --wait

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: build-output
          path: tests/LeadCMS.Tests/bin/${{ env.BUILD_CONFIG }}/

      - name: Test
        env:
          TEST_FILTER: ${{ matrix.filter }}
          TEST_GROUP: ${{ matrix.group }}
        run: |
          dotnet test tests/LeadCMS.Tests/bin/${{ env.BUILD_CONFIG }}/net8.0/LeadCMS.Tests.dll \
            --logger "trx;LogFileName=${TEST_GROUP}.trx" \
            --filter "${TEST_FILTER}" \
            --verbosity normal \
            --results-directory "${{ github.workspace }}"

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: "${{ matrix.group }}.trx"
          check_name: .NET Tests / ${{ matrix.group }}
          large_files: true
